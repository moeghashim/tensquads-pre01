name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      machine_trial:
        description: Run the boat machine trial
        type: boolean
        default: false
      bus_trial:
        description: Run the Cloudflare bus trial
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('trial-{0}', github.run_id) || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  required-checks-summary:
    name: Required checks
    if: ${{ always() }}
    needs: [required-checks, cloudflare-build, fallow-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful validation
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          for (const name of ['required-checks', 'cloudflare-build', 'fallow-audit']) {
            const result = needs[name]?.result;
            const expectedSkip = name === 'fallow-audit' && process.env.EVENT_NAME !== 'pull_request' && result === 'skipped';
            if (result !== 'success' && !expectedSkip) {
              console.error(`${name}: ${result ?? 'missing'}`);
              process.exitCode = 1;
            }
          }
          NODE

  cloudflare-build:
    name: Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # This job has no deploy key. The kit is not installed. The Worker bundle does not import it.
      - run: npm ci
      - run: npm run build:cloudflare

  fallow-audit:
    name: Fallow audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Load the kit deploy key
        env:
          KIT_DEPLOY_KEY: ${{ secrets.KIT_DEPLOY_KEY }}
        run: |
          if [ -z "$KIT_DEPLOY_KEY" ]; then
            echo "KIT_DEPLOY_KEY is empty. The kit install will be skipped."
            exit 0
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KIT_DEPLOY_KEY" > ~/.ssh/kit
          chmod 600 ~/.ssh/kit
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/kit -o IdentitiesOnly=yes"

      - name: Install dependencies
        run: npm ci

      - name: Install the agent kit
        run: |
          mkdir -p node_modules/@tensquads
          if [ ! -f "$HOME/.ssh/kit" ]; then
            echo "The kit deploy key is absent. Fallow will resolve a local module stub."
            mkdir -p node_modules/@tensquads/agent-kit
            printf '%s\n' '{"name":"@tensquads/agent-kit","private":true,"type":"module"}' > node_modules/@tensquads/agent-kit/package.json
            printf '%s\n' 'export function digestOf() { return ""; }' > node_modules/@tensquads/agent-kit/index.js
            exit 0
          fi
          npm ci --prefix tools/agent-kit
          ln -sfn "$PWD/tools/agent-kit/node_modules/@tensquads/agent-kit" node_modules/@tensquads/agent-kit

      - name: Audit changed code
        uses: fallow-rs/fallow@90833be1e8d12202e6f6084c417585e3b78005ce # v3.40.0
        with:
          command: audit
          gate: new-only
          fail-on-issues: true
          # Re-resolve generated types instead of restoring stale missing-import results.
          no-cache: true

  required-checks:
    name: Required checks
    strategy:
      fail-fast: false
      # macOS only. The screenshot baselines are macOS captures, and every other
      # test runs here too. A second Ubuntu copy added only a second flaky run.
      matrix:
        os:
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Load the kit deploy key
        env:
          KIT_DEPLOY_KEY: ${{ secrets.KIT_DEPLOY_KEY }}
        run: |
          if [ -z "$KIT_DEPLOY_KEY" ]; then
            echo "KIT_DEPLOY_KEY is empty. The kit install will be skipped."
            exit 0
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KIT_DEPLOY_KEY" > ~/.ssh/kit
          chmod 600 ~/.ssh/kit
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/kit -o IdentitiesOnly=yes"

      - name: Install dependencies
        run: npm ci

      - name: Install the agent kit
        run: |
          if [ ! -f "$HOME/.ssh/kit" ]; then
            echo "The kit deploy key is absent. The kit install was skipped."
            exit 0
          fi
          npm ci --prefix tools/agent-kit
          mkdir -p node_modules/@tensquads
          ln -sfn "$PWD/tools/agent-kit/node_modules/@tensquads/agent-kit" node_modules/@tensquads/agent-kit

      # mise-action saves a cache only when install is true, and that path adds
      # --locked. This lock has no Java URL, so the tools install with
      # `mise install` and actions/cache stores them. The key includes the
      # lock hash (PLAN) and the OS, so Linux and macOS do not share a JDK.
      # mise.toml also pins the TLC jar. A hit that has only Java still
      # installs the jar. Dependabot keeps its own cache, and the macOS copy
      # was saved without the jar.
      - name: Restore mise tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/mise
          key: mise-${{ runner.os }}-${{ hashFiles('mise.lock') }}

      - name: Install mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: false
          cache: false

      - name: Install mise tools
        run: mise install

      - name: Install Playwright
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      # Each OS job gets its own database. The script uses the non-pooled host.
      # Dependabot has no secret, so the script skips. Any other missing secret fails.
      - name: Create a private test database
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: node scripts/ci-test-database.mjs create

      - name: Verify
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PLATFORM_ORG_ID: ${{ vars.CLERK_PLATFORM_ORG_ID }}
        run: make verify

      # Traces and screenshots from failed browser tests. Kept seven days.
      - name: Keep browser test evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Drop the private test database
        if: always()
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: node scripts/ci-test-database.mjs drop

  machine-trial:
    concurrency:
      group: machine-trial
      cancel-in-progress: false
    name: Machine trial
    if: github.event_name == 'workflow_dispatch' && inputs.machine_trial
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Load the kit deploy key
        env:
          KIT_DEPLOY_KEY: ${{ secrets.KIT_DEPLOY_KEY }}
        run: |
          if [ -z "$KIT_DEPLOY_KEY" ]; then
            echo "KIT_DEPLOY_KEY is empty. The kit install will be skipped."
            exit 0
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KIT_DEPLOY_KEY" > ~/.ssh/kit
          chmod 600 ~/.ssh/kit
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/kit -o IdentitiesOnly=yes"

      - name: Install dependencies
        run: npm ci

      - name: Install the agent kit
        run: |
          if [ ! -f "$HOME/.ssh/kit" ]; then
            echo "The kit deploy key is absent. The kit install was skipped."
            exit 0
          fi
          npm ci --prefix tools/agent-kit
          mkdir -p node_modules/@tensquads
          ln -sfn "$PWD/tools/agent-kit/node_modules/@tensquads/agent-kit" node_modules/@tensquads/agent-kit

      - name: Prove one real machine
        env:
          MACHINE_TRIAL: "1"
          BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}
          BOAT_ADMIN_API_KEY: ${{ secrets.BOAT_ADMIN_API_KEY }}
        run: node --experimental-strip-types --test --test-force-exit packages/adapters/test/live/machine-trial.test.ts

      - name: Remove the trial machines
        if: always()
        env:
          BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}
          BOAT_ADMIN_API_KEY: ${{ secrets.BOAT_ADMIN_API_KEY }}
        run: node --experimental-strip-types packages/adapters/test/live/cleanup.ts

  bus-trial:
    name: Bus trial
    if: github.event_name == 'workflow_dispatch' && inputs.bus_trial
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Load the kit deploy key
        env:
          KIT_DEPLOY_KEY: ${{ secrets.KIT_DEPLOY_KEY }}
        run: |
          if [ -z "$KIT_DEPLOY_KEY" ]; then
            echo "KIT_DEPLOY_KEY is empty. The kit install will be skipped."
            exit 0
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KIT_DEPLOY_KEY" > ~/.ssh/kit
          chmod 600 ~/.ssh/kit
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/kit -o IdentitiesOnly=yes"

      - name: Install dependencies
        run: npm ci

      - name: Install the agent kit
        run: |
          if [ ! -f "$HOME/.ssh/kit" ]; then
            echo "The kit deploy key is absent. The kit install was skipped."
            exit 0
          fi
          npm ci --prefix tools/agent-kit
          mkdir -p node_modules/@tensquads
          ln -sfn "$PWD/tools/agent-kit/node_modules/@tensquads/agent-kit" node_modules/@tensquads/agent-kit

      - name: Prove one real queue delivery
        env:
          BUS_TRIAL: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}
        run: node --experimental-strip-types scripts/bus-trial.mjs

      - name: Remove the trial bus
        if: always()
        env:
          BUS_TRIAL: "1"
          BUS_TRIAL_CLEANUP: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}
        run: node --experimental-strip-types scripts/bus-trial.mjs
