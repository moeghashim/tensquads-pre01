<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Node · Agent-UI</title>
<script>try { const t = localStorage.getItem("agent-ui.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<script>
// Inside the design system page, a preview must not scroll the page around it.
// Focus does not scroll, and scrollIntoView moves only the element's own scroll box.
if (window.top !== window) {
  const focus = HTMLElement.prototype.focus;
  HTMLElement.prototype.focus = function (options) { focus.call(this, { ...options, preventScroll: true }); };
  Element.prototype.scrollIntoView = function () {
    let box = this.parentElement;
    while (box && !(box.scrollHeight > box.clientHeight && /auto|scroll/.test(getComputedStyle(box).overflowY))) box = box.parentElement;
    if (!box) return;
    const r = this.getBoundingClientRect(), b = box.getBoundingClientRect();
    if (r.top < b.top) box.scrollTop -= b.top - r.top;
    else if (r.bottom > b.bottom) box.scrollTop += r.bottom - b.bottom;
  };
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<script src="../components/bundle.js"></script>
</head>
<body>
<!-- @dsCard group="Canvas" height=270 subtitle="One node per step: tinted icon tile, name, type line, ports" -->
<style>
  html, body { margin: 0; background: var(--canvas); }
  .stage { font-family: var(--font-sans); padding: 20px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .stage--canvas { background-image: radial-gradient(var(--dot-grid) 1px, transparent 1px); background-size: 20px 20px; }
  .lbl { font: 500 11px/16px var(--font-sans); color: var(--text-tertiary); margin-bottom: 8px; letter-spacing: .3px; text-transform: uppercase; }
  
</style>
<div class="aui stage stage--canvas" id="stage"></div>
<script>
(function(){ var U = window.AgentUI; var S = document.getElementById('stage'); 
  var col = function(label){ var w=document.createElement('div'); w.innerHTML='<div class="lbl">'+label+'</div>'; var r=document.createElement('div'); r.style.cssText='display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start'; w.appendChild(r); S.appendChild(w); return r; };
  var r = col('Default · selected · palette families');
  r.appendChild(U.Node({kind:'agent', title:'Classifier', meta:'Agent'}));
  r.appendChild(U.Node({kind:'agent', title:'Recipe', meta:'Agent', selected:true}));
  r.appendChild(U.Node({kind:'start', title:'Start'}));
  r.appendChild(U.Node({kind:'end', title:'End'}));
  var r2 = col('Every family');
  [['classify','Classify'],['note','Note'],['file','File search'],['shield','Guardrails'],['mcp','MCP'],['while','While'],['approval','User approval'],['transform','Transform'],['state','Set state']].forEach(function(p){ r2.appendChild(U.Node({kind:p[0], title:p[1], meta: p[0]==='note'?'':'Step'})); });
 })();
</script>

</body>
</html>
